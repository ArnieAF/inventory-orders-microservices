# Servidor del frontend (se copia como /etc/nginx/conf.d/default.conf en nginx-unprivileged).
# Mismo origen: el navegador solo habla con este nginx, que reenvía /api/ y /ws al API Gateway.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # DNS interno de Docker: el nombre del gateway se resuelve en cada petición,
    # así nginx arranca aunque api-gateway aún no exista y sigue sus reinicios.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API REST -> gateway (sin reescribir la ruta).
    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Defensa en profundidad: estas cabeceras solo existen entre servicios.
        proxy_set_header X-Internal-Key "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-Username "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # WebSocket (STOMP) -> gateway. Conexiones largas: heartbeats cada 10 s.
    location /ws {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-Username "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Recursos con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html siempre se revalida (apunta a los recursos con hash de cada versión).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Ficheros ocultos: nunca.
    location ~ /\. {
        deny all;
    }

    # SPA: cualquier ruta de la app sirve index.html (el resto de ficheros sin hash, sin caché larga).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
