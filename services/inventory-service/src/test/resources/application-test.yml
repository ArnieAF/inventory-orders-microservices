# Solo para pruebas: H2 en memoria en modo PostgreSQL + Flyway (sin Docker socket ni Testcontainers).
# Los secretos de prueba son constantes falsas definidas en TestSecrets (se pasan con
# @SpringBootTest(properties=...)); no hay ninguno real escrito aqui.
spring:
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      # Equivalente H2 del "SET lock_timeout = 4000" de PostgreSQL (perfil por defecto).
      connection-init-sql: SET LOCK_TIMEOUT 4000
  jpa:
    hibernate:
      # En pruebas se valida que las entidades coinciden con las migraciones Flyway (V1 y V2).
      ddl-auto: validate
app:
  notifications:
    base-url: http://localhost:9
    async: false
