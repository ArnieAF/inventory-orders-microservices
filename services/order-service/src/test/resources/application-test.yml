# Perfil de pruebas: H2 en modo PostgreSQL + Flyway real (sin Docker ni Testcontainers).
# Los valores de abajo son solo de prueba y no se usan fuera de los tests.
spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      # En produccion es "none"; en pruebas se valida que las entidades coinciden con la migracion V1.
      ddl-auto: validate

app:
  jwt:
    secret: test-only-jwt-secret-0123456789-abcdefghijklmnop
    issuer: micro-inventory
  internal:
    api-key: test-only-internal-key
  notifications:
    async: false
