server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: auth-service
  # La conexion (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD) viene del entorno: sin valores por defecto.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

# Hibernate registra el mensaje de la BD ante un UNIQUE/CHECK, y ese mensaje incluye el valor en conflicto
# (email). El error ya se traduce a 409/500 generico; el detalle no debe acabar en los logs.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  jwt:
    # JWT_SECRET es obligatorio (>= 32 caracteres). Sin valor por defecto: si falta, el arranque falla.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:micro-inventory}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
