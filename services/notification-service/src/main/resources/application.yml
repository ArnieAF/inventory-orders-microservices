# notification-service (:8084)
#
# Sin valores por defecto inseguros: JWT_SECRET e INTERNAL_API_KEY no tienen valor por defecto
# y el arranque falla con un mensaje claro si faltan (ver AppProperties).
# La conexión a la base se toma de SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (relaxed binding).

server:
  port: 8084
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: notification-service
  jackson:
    # Instant como cadena ISO-8601 UTC (contrato §5); los nulos se serializan (targetUserId: null).
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Los enum solo se aceptan por nombre ("NEW_ORDER"), nunca por posición numérica.
      fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo gestiona Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:micro-inventory}
  internal-api-key: ${INTERNAL_API_KEY:}
  websocket:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    connect-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
