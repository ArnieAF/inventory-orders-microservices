# Cabeceras de seguridad (contrato §10). Se incluyen en cada location que añade
# cabeceras propias, porque add_header de un location anula las del nivel superior.
#
# CSP: sin 'unsafe-inline' ni 'unsafe-eval'. Scripts y estilos solo del propio origen
# (Vite emite JS y CSS como archivos; el tema inicial va en /theme-init.js). Los estilos
# que React aplica por JS (CSSOM) no los bloquea style-src. WebSocket: ws:/wss: para /ws.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
